name: Security Test

on: [push, pull_request, workflow_dispatch]

jobs:
  scan:
    runs-on: ubuntu-latest
    container: semgrep/semgrep

    steps:
      - uses: actions/checkout@v4

      - name: Semgrep scan (p/php)
        run: semgrep scan --config p/php --severity ERROR --text-output semgrep-php.txt --json-output semgrep-php.json --error .

      - name: Semgrep scan (custom rule)
        if: always()
        run: semgrep scan --config .semgrep/custom.yml --text-output semgrep-custom.txt --json-output semgrep-custom.json --error .

      - name: Save report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-report
          path: |
            semgrep-php.txt
            semgrep-php.json
            semgrep-custom.txt
            semgrep-custom.json
