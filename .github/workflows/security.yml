name: Security Test

on: [push, pull_request, workflow_dispatch]

jobs:
  scan:
    runs-on: ubuntu-latest
    container: semgrep/semgrep

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Semgrep version
        run: semgrep --version

      - name: Semgrep scan (p/php)
        run: semgrep scan --config p/php --severity ERROR --text-output semgrep-php.txt --json-output semgrep-php.json --error .

      - name: Semgrep scan (custom rule)
        if: always()
        run: semgrep scan --config .semgrep/custom.yml --text-output semgrep-custom.txt --json-output semgrep-custom.json --error .

      - name: Semgrep scan (auto, informacinis)
        if: always()
        run: semgrep scan --config auto --text-output semgrep-auto.txt .

      - name: Save report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: semgrep-report
          path: |
            semgrep-php.txt
            semgrep-php.json
            semgrep-custom.txt
            semgrep-custom.json
            semgrep-auto.txt
