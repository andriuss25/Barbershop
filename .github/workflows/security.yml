name: Security Test

on: [push, workflow_dispatch]

jobs:
  scan:
    runs-on: ubuntu-latest
    container: semgrep/semgrep
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: auto
            config: auto
          - name: php
            config: p/php
          - name: owasp
            config: p/owasp-top-ten

    steps:
      - uses: actions/checkout@v4

      - name: Semgrep scan
        run: semgrep scan --config ${{ matrix.config }} --json-output semgrep-${{ matrix.name }}.json --text-output semgrep-${{ matrix.name }}.txt .

      - name: Save report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-${{ matrix.name }}
          path: |
            semgrep-${{ matrix.name }}.json
            semgrep-${{ matrix.name }}.txt
