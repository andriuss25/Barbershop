name: Security Test

on: [push, pull_request, workflow_dispatch]

jobs:
  scan:
    runs-on: ubuntu-latest
    container: semgrep/semgrep

    steps:
      - uses: actions/checkout@v4

      - name: Semgrep scan
        run: semgrep scan --config p/php --severity ERROR --text-output semgrep-results.txt --json-output semgrep-results.json --error .

      - name: Save report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-report
          path: |
            semgrep-results.txt
            semgrep-results.json
